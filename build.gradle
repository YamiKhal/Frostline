plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.frostline'
archivesBaseName = 'frostline'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client { workingDirectory project.file('run'); mods { frostline { source sourceSets.main } } }
        server { workingDirectory project.file('run'); mods { frostline { source sourceSets.main } } }
    }
}

repositories { mavenCentral() }

// Railways Untold is an optional runtime dependency: the compat classes compile against
// its jar but Frostline never requires it (see FrostlineMixinPlugin / RailwaysCompat).
// Override with -PrailwaysUntoldJar=<path> if the jar lives elsewhere.
def railwaysUntoldJar = project.findProperty('railwaysUntoldJar') ?:
        'C:/Users/Aaron Schwizerberg/AppData/Roaming/ATLauncher/instances/LastDeparture/mods/railwaysuntold-1.20.1-forge-1.2.2.jar'

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.20'
    compileOnly files(railwaysUntoldJar)
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'frostline',
            'Specification-Vendor'    : 'frostline',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'frostline',
            'MixinConfigs'            : 'frostline.mixins.json'
        ])
    }
}
