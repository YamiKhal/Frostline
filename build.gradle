plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.frostline'
archivesBaseName = 'frostline'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client { workingDirectory project.file('run'); mods { frostline { source sourceSets.main } } }
        server { workingDirectory project.file('run'); mods { frostline { source sourceSets.main } } }
    }
}

repositories { mavenCentral() }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.20'
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'frostline',
            'Specification-Vendor'    : 'frostline',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'frostline'
        ])
    }
}
